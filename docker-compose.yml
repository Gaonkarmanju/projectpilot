# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    container_name: projectpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: projectpilot
      POSTGRES_PASSWORD: projectpilot
      POSTGRES_DB: projectpilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
